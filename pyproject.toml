[project]
name = "sto-assist"
version = "0.1.0"
description = "AI-помічник для оформлення замовлень-нарядів на ремонт автомобілів Tesla"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3.0", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27", "weasyprint>=60", "qrcode>=7.4", "openpyxl>=3.1", "tzdata"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sto-assist = "sto_assist.cli:main"
sto-assist-web = "sto_assist.web:main"

[tool.setuptools.packages.find]
include = ["sto_assist*"]

[tool.setuptools.package-data]
sto_assist = ["data/*.json", "static/*.html", "static/icons/*.png"]
